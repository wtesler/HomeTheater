<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Theater</title>
    <link rel="stylesheet" href="launcher.css" />
</head>
<body>
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="launcher-shell">
        <header class="launcher-header">
            <div class="brand">
                <span class="brand-badge">HTPC</span>
                <h1>Home Theater</h1>
            </div>
            <div class="clock" id="clockDisplay"></div>
        </header>

        <main class="launcher-main">
            <h2 class="section-title">Streaming Apps</h2>
            <div class="app-grid" id="appGrid" role="grid" aria-label="Streaming Applications"></div>
        </main>

        <footer class="launcher-footer">
            <!--<div class="hint-group">
                <span class="key-pill">D-Pad</span><span>Navigate</span>
            </div>
            <div class="hint-group">
                <span class="key-pill">OK</span><span>Launch App</span>
            </div> -->
            <div class="hint-group">
                <span class="key-pill">⏻</span><span>Power</span>
            </div>
            <div class="hint-group">
                <span class="key-pill">🏠︎</span><span>Home Screen</span>
            </div>
            <div class="hint-group">
                <span class="key-pill">MENU</span><span>Settings</span>
            </div>
            <div class="hint-group">
                <span class="key-pill">EXIT</span><span>Back</span>
            </div>
            <div class="hint-group" id="gpuDiagnosticsHint" style="display: none;">
                <span class="key-pill">Ctrl+Shift+G</span><span>GPU Info</span>
            </div>
            <div class="hint-group" id="exitHint" style="display: none;">
                <span class="key-pill">F12</span><span>Exit</span>
            </div>
        </footer>
    </div>

    <script src="launcher.js"></script>
</body>
</html>
